spring:
  application:
    name: jntuh-exam-management

  # H2 embedded database (dev default - zero config needed)
  datasource:
    url: jdbc:h2:file:./data/examdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: JNTUHExamManagementSystemSecretKey2024ForJWTTokenGenerationAndValidation
    expiration-ms: 86400000

# Logging
logging:
  level:
    com.jntuh.exammanagement: INFO
    org.springframework.security: WARN

---
# MySQL Production Profile
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/exam_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false
